phases:
  - id: mvp
    name: MVP
    description: Минимально жизнеспособный продукт
    order: 1
  - id: support
    name: Сопровождение
    description:
      Диагностика, ответы по коду и технические доработки без изменения
      продуктового описания
    order: 2
tasks:
  - id: task-001
    phase: mvp
    title: Визуальная заглушка главной страницы с картой
    description: >-
      Создать главную страницу приложения с интерактивной картой Казахстана и
      статическими данными-заглушками о ТЛЦ.

      Цель: дать пользователю первый визуальный результат как можно быстрее.

      Карта отображается с маркерами ТЛЦ, маркеры имеют всплывающие подсказки с
      названиями. Поддерживается масштабирование и панорамирование.
    priority: high
    acceptance_criteria:
      - Главная страница с картой Казахстана отображается без ошибок
      - На карте нанесены маркеры ТЛЦ из статических данных-заглушек
      - При наведении на маркер показывается подсказка с названием центра
      - Поддерживается масштабирование и панорамирование карты
    depends_on: []
    related_feature: Интерактивная карта с ТЛЦ
    status: completed
    summary: "Реализована главная страница с интерактивной картой Казахстана на
      Leaflet. На карту нанесены 16 маркеров ТЛЦ из статических данных-заглушек
      (lib/mock-data.ts). При наведении на маркер показывается подсказка с
      названием центра. Поддерживается масштабирование и панорамирование.
      Основная реализация: app/page.tsx, components/map-client.tsx,
      components/map-loader.tsx."
  - id: task-002
    phase: mvp
    title: Типы объектов, легенда и фильтрация по типу
    description:
      Добавить цветовую индикацию маркеров по 6 типам объектов (П1–П6),
      легенду на карте и возможность фильтровать объекты по типу.
    priority: high
    acceptance_criteria:
      - Каждый тип объекта имеет уникальный цвет маркера
      - Легенда типов отображается на карте
      - Можно фильтровать объекты по типу
    depends_on:
      - task-001
    related_feature: Типы объектов ТЛЦ
    status: completed
    summary: "Добавлена цветовая индикация для 6 типов объектов (П1–П6) с
      уникальными цветами маркеров. Реализована легенда на карте (прозрачная
      панель в правом верхнем углу) с чекбоксами для фильтрации отображаемых
      типов. Основная реализация: components/map-client.tsx."
  - id: task-003
    phase: mvp
    title: Транспортные коридоры и пограничные переходы
    description: Нанести на карту линии транспортных коридоров (ТМТМ, Паромная
      линия, Транссиб, Север-Юг, Западный, Восточный) и отметить пограничные
      переходы. Слой коридоров можно включать/отключать.
    priority: high
    acceptance_criteria:
      - Линии транспортных коридоров отображаются на карте
      - Каждый коридор имеет свой цвет и подпись
      - Пограничные переходы отмечены специальным символом
      - Слой коридоров можно включать и отключать
    depends_on:
      - task-001
    related_feature: Транспортные коридоры и погранпереходы
    status: completed
    summary: >-
      На карту нанесены 6 транспортных коридоров (ТМТМ, Паромная линия,
      Транссиб,

      Север-Юг, Западный, Восточный) с уникальными цветами и подписями в виде

      меток в средней точке. 10 пограничных переходов отмечены ромбовидным

      маркером со звездой (✦). Слой коридоров включается/отключается чекбоксом

      в панели легенды. Данные: lib/corridors.ts, отрисовка:
      components/map-client.tsx.
  - id: task-004
    phase: mvp
    title: Фильтрация по статусу и панель статистики
    description: "Добавить фильтр по статусу (Действующий / Строится / Проект) и
      информационную панель с ключевыми показателями сектора ТЛЦ: количество
      объектов, складской фонд, мощности, распределение по регионам."
    priority: high
    acceptance_criteria:
      - Фильтр по статусу доступен в панели слоёв
      - При выборе статуса на карте остаются только ТЛЦ этого статуса
      - Панель статистики отображается на странице
      - Данные соответствуют реестру ТЛЦ
    depends_on:
      - task-001
      - task-002
    related_feature: Фильтрация по статусу
    status: completed
    summary: "Реализован фильтр по статусу (Действующий / Строится / Проект) в
      панели слоёв на карте. При выборе статуса на карте остаются только ТЛЦ
      соответствующего статуса. Добавлена панель статистики
      (components/stats-panel.tsx) с ключевыми показателями: количество
      объектов, складской фонд (м²), мощности (TEU/год), распределение по
      регионам. Панель обновляется при изменении фильтров. Данные соответствуют
      реестру ТЛЦ."
  - id: task-005
    phase: mvp
    title: Детальная информация о ТЛЦ при клике
    description:
      "При клике на маркер ТЛЦ открывается попап с детальной информацией:
      название, тип, регион, статус, мощность, адрес, услуги."
    priority: medium
    acceptance_criteria:
      - При клике на маркер открывается попап с деталями центра
      - "В попапе отображаются: название, тип, регион, статус, мощность"
      - Попап можно закрыть
    depends_on:
      - task-001
    related_feature: Детальная информация о ТЛЦ
    status: completed
    summary:
      "Реализован попап с детальной информацией о ТЛЦ при клике на маркер. В
      попапе отображаются: название, тип, регион, статус, мощность (TEU/год),
      складской фонд (м²), адрес и услуги (при наличии). Попап закрывается
      стандартной кнопкой Leaflet. Основная реализация:
      components/map-client.tsx (компонент Popup внутри Marker), app/globals.css
      (стили .tlc-popup)."
  - id: task-006
    phase: mvp
    title: Переключение базовых карт и слой плотности населения
    description:
      Добавить переключение между тремя базовыми картами (светлая CARTO,
      тёмная CARTO, OpenStreetMap). Реализовать слой плотности населения
      Казахстана с цветовой заливкой регионов. Слой можно включать/отключать,
      цветовая шкала отображается в легенде.
    priority: medium
    acceptance_criteria:
      - Доступно переключение между светлой CARTO, тёмной CARTO и OpenStreetMap
      - Слой плотности населения отображается на карте
      - Слой можно включать и отключать
      - Цветовая шкала плотности отображается в легенде
    depends_on:
      - task-001
    related_feature: Интерактивная карта с ТЛЦ
    status: completed
    summary:
      "Реализовано переключение между тремя базовыми картами (светлая CARTO,
      тёмная CARTO, OpenStreetMap) через radio-кнопки в панели слоёв. Добавлен
      слой плотности населения Казахстана с цветовой заливкой регионов
      (choropleth) — 17 регионов с упрощёнными полигонами. Слой включается/
      отключается чекбоксом, цветовая шкала отображается в легенде под
      чекбоксом. Основная реализация: components/map-client.tsx,
      lib/regions.ts."
  - id: task-007
    phase: mvp
    title: Слой ВРП (региональный внутренний продукт)
    description:
      Реализовать слой с цветовой заливкой регионов Казахстана по уровню
      ВРП. Слой можно включать/отключать. Цветовая шкала ВРП отображается в
      легенде.
    priority: medium
    acceptance_criteria:
      - Слой ВРП отображается на карте
      - Слой можно включать и отключать
      - Цветовая шкала ВРП отображается в легенде
    depends_on:
      - task-001
    related_feature: Слой ВРП (региональный внутренний продукт)
    status: completed
    summary: "Реализован слой ВРП с цветовой заливкой 17 регионов Казахстана
      (choropleth). Данные по ВРП (млрд тг) и цветовая шкала из 5 интервалов
      (синяя схема) размещены в lib/regions-grp.ts. Слой включается/отключается
      чекбоксом в панели легенды; при включении отображается цветовая шкала.
      Основная реализация: lib/regions-grp.ts, components/map-client.tsx."
  - id: task-008
    phase: mvp
    title: Яркий красочный дизайн шапки и карты
    description: "Обновить дизайн приложения: сделать шапку с градиентом
      (индиго-фиолетовый-розовый), заменить иконку на маркер карты, добавить
      подзаголовок 'Геоаналитическая карта ТЛЦ' и бейдж v3. Улучшить визуальное
      оформление панели слоёв и статистики — добавить градиенты, тени,
      скругления, цветовые акценты. Сделать дизайн ярким и красочным как на
      референсе."
    priority: medium
    acceptance_criteria:
      - Шапка имеет градиентный фон с индиго-фиолетово-розовыми тонами
      - Иконка в шапке — маркер карты вместо sparkles
      - Отображается подзаголовок 'Геоаналитическая карта ТЛЦ'
      - Панель слоёв и статистики имеют улучшенный дизайн с тенями и скруглениями
      - Общий вид яркий и красочный
    depends_on:
      - task-001
    related_feature: Интерактивная карта с ТЛЦ
    status: completed
    summary: "Шапка заменена на градиентную (индиго-фиолетово-розовую) с иконкой
      MapPin, подзаголовком 'Геоаналитическая карта ТЛЦ' и бейджем v3. Панель
      слоёв получила градиентный заголовок, тени panel-shadow, разделители и
      заголовки секций с цветовыми акцентами и иконками. Панель статистики —
      градиентную шапку, закруглённые карточки с градиентами и тенями. Основные
      файлы: app/layout.tsx, components/map-client.tsx,
      components/stats-panel.tsx, app/globals.css."
  - id: task-009
    phase: mvp
    title: Реалистичные маршруты транспортных коридоров
    description: "Заменить прямые линии транспортных коридоров на реалистичные
      маршруты, проходящие по actual железнодорожным путям и трассам Казахстана.
      Каждый коридор должен иметь множество промежуточных точек, повторяющих
      реальную географию маршрута: изгибы вдоль ж/д линий, обход горных
      массивов, следование вдоль рек и долин. Маршруты должны выглядеть
      профессионально, как на реальных картах транспортных коридоров."
    priority: high
    acceptance_criteria:
      - Каждый транспортный коридор имеет реалистичную траекторию с множеством
        промежуточных точек
      - Маршруты повторяют реальную географию ж/д путей и трасс Казахстана
      - Коридоры выглядят профессионально, без прямых линий между городами
      - Подписи коридоров отображаются в средней точке маршрута
    depends_on:
      - task-003
    related_feature: Транспортные коридоры и погранпереходы
    status: completed
    summary: "Каждый из 6 коридоров (ТМТМ, Паромная линия, Транссиб, Север-Юг,
      Западный, Восточный) получил 25–90 промежуточных точек, повторяющих
      реальные ж/д пути и трассы Казахстана. Маршруты огибают горные массивы,
      следуют вдоль долин и железнодорожных веток. Подписи отображаются в
      средней точке через getMidpoint(). Основная реализация: lib/corridors.ts."
  - id: task-010
    phase: mvp
    title: Добавить логотип CALTA в шапку и подобрать градиент под цвета лого
    description:
      Добавить загруженный логотип (файл .vibecraft/assets/WhatsApp Image
      2026-06-22 at 12.34.39.jpeg) в шапку приложения. Разместить лого слева от
      названия CALTA. Подобрать градиент шапки под цвета логотипа
      (золотисто-жёлтые, тёмно-синие/бордовые тона). Логотип должен быть
      адаптивным и хорошо смотреться на мобильных устройствах.
    priority: medium
    acceptance_criteria:
      - Логотип отображается в шапке слева от названия CALTA
      - Градиент шапки подобран под цветовую гамму логотипа
      - Логотип выглядит чётко и не растянут
      - Шапка сохраняет градиентный стиль
    depends_on:
      - task-008
    related_feature: Интерактивная карта с ТЛЦ
    status: completed
    summary: "Логотип CALTA добавлен в шапку слева от названия (app/layout.tsx).
      Изображение скопировано в public/assets/calta-logo.jpeg, отображается
      через next/image с адаптивными размерами (h-9 w-9 на мобильных, h-10 w-10
      на desktop). Градиент шапки заменён с индиго-фиолетового на глубокий
      тёмно-синий (#0B1A2E) → бордовый → тёплый тёмный с золотистым отливом,
      соответствующий цветам логотипа (app/globals.css: .gradient-hero)."
  - id: task-011
    phase: mvp
    title: Реалистичные маршруты транспортных коридоров по фактическим ж/д путям
    description: >-
      Заменить все маршруты транспортных коридоров на реальные траектории,
      проходящие по фактическим железнодорожным путям Казахстана. Каждый коридор
      должен иметь множество промежуточных точек, повторяющих реальные ж/д
      линии:


      ТМТМ / Средний коридор: Хоргос → Алматы → Шымкент → Кызылорда → Бейнеу →
      Актау → Курык (по Турксибу и южной ж/д магистрали)


      Северный / Транссиб: Уральск → Актобе → Костанай → Караганда → Павлодар →
      Семей (по северной ж/д линии)


      МТК Север-Юг: Астрахань → Атырау → Актобе → Кызылорда → Шымкент → Ташкент
      (по западной ж/д ветке)


      Западный коридор: Уральск → Актобе → Атырау → Актау


      Восточный коридор: Семей → Караганда → Алматы → Хоргос → Достык


      Паромная линия: Курык → Баку (по Каспию)


      Маршруты должны огибать горные массивы, следовать вдоль долин и
      железнодорожных веток. Каждый коридор — 25-90 промежуточных точек.
    priority: high
    acceptance_criteria:
      - Каждый транспортный коридор имеет реалистичную траекторию с 25-90
        промежуточными точками
      - Маршруты повторяют реальные ж/д пути Казахстана
      - Коридоры выглядят профессионально, без прямых линий между городами
      - Подписи коридоров отображаются в средней точке маршрута
    depends_on:
      - task-003
    related_feature: Транспортные коридоры и погранпереходы
    status: completed
    summary:
      "Все 6 коридоров (ТМТМ, Паромная линия, Транссиб, Север-Юг, Западный,
      Восточный) переписаны с реалистичными траекториями по фактическим ж/д
      путям Казахстана (25-90 точек каждый). Маршруты огибают горные массивы,
      следуют вдоль ж/д веток и долин. Подписи — в средней точке маршрута.
      Основная реализация: lib/corridors.ts."
  - id: task-012
    phase: mvp
    title: Добавить сворачивание панели слоёв
    description: Добавить кнопку-гамбургер или стрелку для
      сворачивания/разворачивания панели слоёв (как у панели статистики). Когда
      панель свёрнута — видна только маленькая кнопка с иконкой Layers. При
