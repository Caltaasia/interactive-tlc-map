    priority: high
    acceptance_criteria:
      - На карте отображаются все 50+ ТЛЦ из реестра
      - Каждый объект имеет корректный тип (П1-П6), регион, статус
      - Мощность и адрес указаны где доступно
      - Маркеры различаются по цвету (тип) и размеру (мощность)
    depends_on:
      - task-001
    related_feature: Интерактивная карта с ТЛЦ
    status: completed
    summary:
      "Добавлены все 58 ТЛЦ из полного реестра v3 (П1–П6) в lib/mock-data.ts:
      7 пограничных хабов (П1), 14 крупных внутренних (П2), 3 морских порта
