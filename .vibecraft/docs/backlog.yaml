    priority: low
    acceptance_criteria:
      - Панель слоёв можно свернуть в маленькую кнопку
      - При свёрнутом состоянии видна только иконка/кнопка
      - При нажатии панель разворачивается полностью
      - Анимация плавная
    depends_on:
      - task-008
    related_feature: Интерактивная карта с ТЛЦ
    status: completed
    summary:
      "Добавлено сворачивание панели слоёв по аналогии с панелью статистики.
      В заголовке панели размещена кнопка со стрелкой (ChevronUp/ChevronDown),
