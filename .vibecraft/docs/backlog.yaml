      иконка Layers и стрелка в градиентном заголовке. При нажатии панель плавно
      разворачивается (transition на max-height + overflow-hidden). Основная
      реализация: components/map-client.tsx."
  - id: task-013
    phase: mvp
    title: Добавить все 50+ ТЛЦ из полного реестра
    description:
      "Обновить статические данные ТЛЦ в lib/mock-data.ts: добавить все
      объекты из реестра v3 (П1-П6) с корректными координатами, типами,
